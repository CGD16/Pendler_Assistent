services:
  pendler-db:
    image: postgres:16-alpine
    container_name: pendler-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pendler_pgdata:/var/lib/postgresql/data
    networks:
      - pendler-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n-pendler:
    image: n8nio/n8n:2.19.5
    container_name: n8n-pendler
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    volumes:
      - n8n_pendler_data:/home/node/.n8n
    networks:
      - pendler-net
    depends_on:
      pendler-db:
        condition: service_healthy

volumes:
  pendler_pgdata:
  n8n_pendler_data:

networks:
  pendler-net:
    name: pendler-net



